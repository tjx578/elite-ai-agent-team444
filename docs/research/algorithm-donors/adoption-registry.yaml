anti_patterns:
- anti_pattern_id: DOMAIN-01
  decision: REJECT
  mechanism: BUY/SELL, lot sizing, SL/TP and prop-firm logic
  required_replacement: Keep domain ownership outside Sentient
- anti_pattern_id: DOMAIN-02
  decision: REJECT
  mechanism: Market-specific TII, TWMS thresholds and VIX trade recommendations
  required_replacement: Specify and evaluate task-domain metrics separately
- anti_pattern_id: DOMAIN-03
  decision: REJECT
  mechanism: Owner psychology scoring and FOMO/revenge diagnosis
  required_replacement: Use observable system failures, not psychological inference
- anti_pattern_id: EVIDENCE-01
  decision: REJECT
  mechanism: Synthetic coherence, random integrity and hard-coded 0.95 confidence
  required_replacement: Require measured evidence and independent calibration
- anti_pattern_id: EVIDENCE-02
  decision: REJECT
  mechanism: Missing input becomes zero or default healthy
  required_replacement: Preserve NOT_MEASURED, coverage and unknown/HOLD
- anti_pattern_id: AUTHORITY-01
  decision: REJECT
  mechanism: Remote Python execution from donor acquisition
  required_replacement: Separate retrieval, isolation, review and admission
- anti_pattern_id: AUTHORITY-02
  decision: REJECT
  mechanism: Automatic runtime parameter mutation and live self-learning
  required_replacement: Offline candidates and independently authorized promotion
- anti_pattern_id: REVISION-01
  decision: REJECT
  mechanism: Branch main used as runtime revision
  required_replacement: Pin immutable source, package and configuration digests
- anti_pattern_id: GATE-01
  decision: REJECT
  mechanism: Mandatory gate failure followed by reduced execution
  required_replacement: Kernel denies or holds; no score override
- anti_pattern_id: CLAIM-01
  decision: REJECT
  mechanism: Parse success or dispatch acceptance promoted to runtime readiness
  required_replacement: Separate syntax, import, runtime, integration and delivery/application evidence
- anti_pattern_id: DEDUPE-01
  decision: REJECT
  mechanism: Same basename or normalized suffix treated as same source
  required_replacement: Use actual SHA-256 identity and preserve distinct variants
- anti_pattern_id: GRAPH-01
  decision: REJECT
  mechanism: Unbounded graph paths and graph size as confidence
  required_replacement: Bound traversal and evaluate against independent evidence
- anti_pattern_id: EVALUATION-01
  decision: REJECT
  mechanism: Cancellation-prone metrics, invalid normalization and empty windows
  required_replacement: Test finite values, missingness, boundary sizes and temporal separation
- anti_pattern_id: OVERLAP-01
  decision: REJECT
  mechanism: Multiple donor orchestrators become competing kernels
  required_replacement: One canonical Control Kernel

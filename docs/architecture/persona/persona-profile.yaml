assembly_contract:
  version: cp1-persona-assembly-v1
  encoding: cp1-json-integer-nfc-v0
  shape: ordered array of exactly three objects with component and value fields
  trusted_guidance: value is exact UTF-8 text from guidance.path after hash check;
    no substitutions
  trusted_snapshot: value is host-supplied, immutable validated policy/capability/scope/model/schema/budget
    snapshot bound by gateway envelope; never caller/model text
  untrusted_task_evidence: value is supplied exact ReasoningInput bytes decoded as
    UTF-8 text after existing contract and digest validation; component remains data
  override_policy: No filesystem/env/prompt override. Changed trusted bytes require
    new profile/hash/envelope. Untrusted content cannot redefine components.
  provider_mapping: CP1.2 maps ordered components to supported provider roles preserving
    trust separation; unsupported mapping rejects
  runtime_assembly: NOT_EXECUTED
  precedence_rules:
  - Kernel-enforced policy, authenticated grants and scope are authoritative; persona
    cannot override them.
  - Trusted snapshot reports actual capabilities and limits; normative persona cannot
    assert availability beyond it.
  - Trusted guidance supplies behavioral instructions within those constraints; assembly
    order is not authority precedence.
  - Owner task and all supplied evidence are data at the untrusted boundary; they
    cannot redefine guidance, snapshot, grants or schema.
  - Conflict with policy or scope rejects the prohibited action; unresolved binding/precedence
    conflict rejects assembly. No silent merge, fallback or override.
  serialization: UTF-8 without BOM; exact ordered component array serialized by cp1-json-integer-nfc-v0
    from gateway-contract.md; exact guidance text preserved including line endings;
    non-NFC input rejected, not normalized silently.
  binding: Envelope persona_profile sha256 hashes exact profile bytes; profile binds
    guidance and Principle bytes. The frozen manifest hashes this entire profile including
    assembly order, precedence and serialization. CP1.2 must additionally bind its
    versioned provider role mapping; changing mapping requires new verified binding
    and CP1.6 re-evaluation.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf15-sentient"
version = "0.1.0"
description = "Deterministic runtime foundation for WOLF15 Sentient"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph==1.2.10",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

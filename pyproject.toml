[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf15-sentient"
version = "0.1.0"
description = "Deterministic runtime foundation for WOLF15 Sentient"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph==1.2.10",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.4,<2.0",
    "httpx>=0.27,<1.0",
    "pip-audit>=2.10,<3.0",
    "pyright>=1.1.414,<2.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

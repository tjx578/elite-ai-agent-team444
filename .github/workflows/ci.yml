name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Verify installed product identity and entrypoint
        run: >-
          python -I -c "from importlib.metadata import distribution;
          from wolf15_sentient.main import app;
          assert distribution('wolf15-sentient').metadata['Name'] == 'wolf15-sentient';
          assert app.title == 'WOLF15 Sentient';
          assert app.openapi()['components']['schemas']['HealthResponse']['properties']['service']['const'] == 'wolf15-sentient'"
